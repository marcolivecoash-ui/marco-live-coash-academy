<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الكورسات | Marco Live Coach</title><link rel="stylesheet" href="css/style.css">
<style>
.course-wrap{max-width:1160px;margin:auto;padding:55px 20px 90px}.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}.course-card{overflow:hidden;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,var(--surface-2),var(--surface));box-shadow:inset 0 1px rgba(255,255,255,.12),0 15px 35px #0002}.course-cover{height:165px;background:linear-gradient(135deg,#10264a,#0b1424);display:grid;place-items:center;color:var(--cyan);font-size:48px}.course-cover img{width:100%;height:100%;object-fit:cover}.course-body{padding:22px}.course-body p,.course-muted{color:var(--muted)}.course-price{font-size:22px;font-weight:900;color:var(--cyan);margin:12px 0}.course-body button{width:100%}.receipt-area{display:grid;gap:10px;margin-top:15px}.receipt-area input{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}.course-message{min-height:24px;color:var(--cyan);margin:18px 0}.course-empty{padding:35px;text-align:center;border:1px dashed var(--border);border-radius:18px;color:var(--muted);grid-column:1/-1}
</style></head>
<body>
<header class="site-header"><div class="container header-inner"><a class="logo" href="index.html">MARCO <span>LIVE COACH</span></a><nav class="nav" id="nav"><a href="index.html">الرئيسية</a><a class="active" href="courses.html">الكورسات</a><a href="my-courses.html">كورساتي</a><a href="booking.html">احجز جلسة</a></nav><div class="header-actions"><button class="lang-btn" id="signOutBtn" type="button">تسجيل الخروج</button><button class="menu-btn" id="menuBtn" type="button">☰</button></div></div></header>
<main><section class="page-hero"><div class="container"><span class="eyebrow">MARCO LIVE COACH ACADEMY</span><h1>اكتشف الكورسات</h1><p>اختار الكورس المناسب ليك وابدأ رحلة التطوير والتعلم.</p></div></section>
<section class="course-wrap"><div id="courseGrid" class="course-grid"><div class="course-empty">جاري تحميل الكورسات...</div></div><p id="courseMessage" class="course-message" role="status"></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/courses.js"></script>
</body></html>
