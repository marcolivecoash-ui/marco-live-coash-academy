<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Marco Live Coach">
  <title>تسجيل الدخول | Marco Live Coach</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 15%,rgba(22,119,255,.22),transparent 55%),var(--bg)}
    .login-card{width:min(100%,460px);padding:38px;background:linear-gradient(145deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:24px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.28)}
    .login-card .logo{display:block;font-size:27px;margin-bottom:28px}
    .login-card h1{font-size:29px;margin-bottom:9px}
    .login-card .intro{color:var(--muted);margin-bottom:22px}
    .google-btn{width:100%;background:#fff;color:#172033;border:0;border-radius:12px;padding:14px 20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
    .google-btn:disabled,.auth-submit:disabled{opacity:.65;cursor:wait}
    .google-mark{font-size:21px;font-weight:900;color:#4285f4}
    .login-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:20px 0}
    .login-divider:before,.login-divider:after{content:"";height:1px;background:var(--border);flex:1}
    .auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
    .auth-tab{border:1px solid var(--border);background:#080f1c;color:var(--muted);padding:10px;border-radius:10px;cursor:pointer;font-weight:700}
    .auth-tab.active{border-color:var(--blue);color:var(--cyan);background:rgba(22,119,255,.1)}
    .auth-form{text-align:right;display:grid;gap:12px}
    .auth-form label{font-size:13px;font-weight:700}
    .auth-form input{width:100%;margin-top:6px;background:#080f1c;color:white;border:1px solid var(--border);padding:13px;border-radius:10px;outline:none}
    .auth-form input:focus{border-color:var(--blue)}
    .auth-submit{width:100%;border:0;margin-top:5px}
    #authStatus{display:block;min-height:25px;margin-top:16px;color:var(--cyan);font-size:13px;overflow-wrap:anywhere}
    .login-foot{font-size:12px!important;margin:20px 0 0!important;color:var(--muted)}
    @media(max-width:480px){.login-card{padding:28px 20px}}
  </style>
</head>
<body>
  <main class="login-screen">
    <section class="login-card">
      <a class="logo" href="login.html">MARCO <span>LIVE COACH</span></a>
      <span class="eyebrow">YOUR JOURNEY STARTS HERE</span>
      <h1>أهلاً بيك</h1>
      <p class="intro">سجّل دخولك أو أنشئ حساب جديد لمتابعة رحلتك وحجز جلساتك.</p>

      <button class="google-btn" id="googleLogin" type="button">
        <span class="google-mark">G</span><span>المتابعة باستخدام Google</span>
      </button>

      <div class="login-divider">أو باستخدام البريد الإلكتروني</div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="showLogin">تسجيل الدخول</button>
        <button type="button" class="auth-tab" id="showSignup">إنشاء حساب</button>
      </div>

      <form class="auth-form" id="emailAuthForm">
        <label>البريد الإلكتروني
          <input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com" required>
        </label>
        <label>كلمة المرور
          <input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="6 أحرف على الأقل" required>
        </label>
        <button class="btn btn-primary auth-submit" id="emailSubmit" type="submit">تسجيل الدخول</button>
      </form>

      <span id="authStatus" role="status" aria-live="polite">يمكنك استخدام Google أو البريد الإلكتروني.</span>
      <p class="login-foot">© 2026 Marco Live Coach</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
