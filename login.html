<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Marco Live Coach">
  <title>تسجيل الدخول | Marco Live Coach</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 15%,rgba(22,119,255,.22),transparent 55%),var(--bg)}
    .login-card{width:min(100%,460px);padding:42px;background:linear-gradient(145deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:24px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.28)}
    .login-card .logo{display:block;font-size:27px;margin-bottom:34px}
    .login-card h1{font-size:30px;margin-bottom:10px}
    .login-card p{color:var(--muted);margin-bottom:28px}
    .google-btn{width:100%;background:#fff;color:#172033;border:0;border-radius:12px;padding:15px 20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
    .google-btn:disabled{opacity:.65;cursor:wait}
    .google-mark{font-size:21px;font-weight:900;color:#4285f4}
    #authStatus{display:block;min-height:25px;margin-top:18px;color:var(--cyan);font-size:13px}
    .login-foot{font-size:12px!important;margin:24px 0 0!important}
    @media(max-width:480px){.login-card{padding:30px 22px}}
  </style>
</head>
<body>
  <main class="login-screen">
    <section class="login-card">
      <a class="logo" href="login.html">MARCO <span>LIVE COACH</span></a>
      <span class="eyebrow">WELCOME BACK</span>
      <h1>أهلاً بيك في رحلتك</h1>
      <p>سجّل دخولك لمتابعة رحلتك وحجز جلسات الكوتشينج.</p>
      <button class="google-btn" id="googleLogin" type="button">
        <span class="google-mark">G</span>
        <span>المتابعة باستخدام Google</span>
      </button>
      <span id="authStatus" role="status" aria-live="polite">تسجيل دخول آمن باستخدام حساب Google</span>
      <p class="login-foot">© 2026 Marco Live Coach</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
