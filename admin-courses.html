<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الكورسات | Marco Live Coach</title><link rel="stylesheet" href="css/style.css">
<style>
.manage-wrap{max-width:1200px;margin:auto;padding:40px 20px 90px}.manage-grid{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:20px;align-items:start}.manage-panel{padding:23px;border:1px solid var(--border);border-radius:20px;background:rgba(255,255,255,.045);backdrop-filter:blur(22px);margin-bottom:22px}.manage-panel h2{font-size:1.2rem;margin-bottom:17px}.manage-form{display:grid;gap:12px}.manage-form label{display:grid;gap:6px;font-weight:700}.manage-form input,.manage-form textarea,.manage-form select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}.manage-form textarea{min-height:85px}.manage-list{display:grid;gap:12px}.manage-item{padding:16px;border:1px solid var(--border);border-radius:15px;background:rgba(255,255,255,.035)}.manage-item small{display:block;color:var(--muted);margin:5px 0}.manage-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.manage-actions button{padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:rgba(255,255,255,.08);color:var(--text);cursor:pointer}.manage-actions .danger{color:#ff9292}.manage-message{min-height:24px;color:var(--cyan);margin:12px 0}.manage-empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px}.video-upload{display:grid;gap:8px;margin-top:12px}.video-upload input{max-width:100%}
@media(max-width:800px){.manage-grid{grid-template-columns:1fr}.manage-panel{padding:18px}}
</style></head>
<body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html">MARCO <span>LIVE COACH</span></a><nav class="nav" id="nav"><a href="admin-dashboard.html">إدارة الحجوزات</a><a class="active" href="admin-courses.html">إدارة الكورسات</a><a href="courses.html">عرض الكورسات</a></nav><div class="header-actions"><button class="lang-btn" id="signOutBtn" type="button">تسجيل الخروج</button><button class="menu-btn" id="menuBtn" type="button">☰</button></div></div></header>
<main class="manage-wrap"><div class="admin-top"><div><span class="eyebrow">MARCO ACADEMY</span><h1>إدارة الكورسات</h1><p id="adminEmail" class="course-muted">جاري التحقق من الصلاحية...</p></div><button class="btn btn-outline" id="refreshBtn" type="button">تحديث ↻</button></div>
<section class="manage-panel"><h2>طلبات شراء الكورسات</h2><div id="purchaseList" class="manage-list"><div class="manage-empty">جاري تحميل الطلبات...</div></div><p id="purchaseMessage" class="manage-message" role="status"></p></section>
<div class="manage-grid"><section class="manage-panel"><h2>إضافة كورس جديد</h2><form id="courseForm" class="manage-form"><label>اسم الكورس بالعربي<input id="titleAr" required maxlength="180"></label><label>اسم الكورس بالإنجليزي<input id="titleEn" maxlength="180"></label><label>وصف الكورس بالعربي<textarea id="descriptionAr"></textarea></label><label>وصف الكورس بالإنجليزي<textarea id="descriptionEn"></textarea></label><label>السعر بالجنيه المصري<input id="priceEgp" type="number" min="1" step=".01" required></label><label>صورة الغلاف (اختياري)<input id="thumbnail" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn btn-primary" type="submit" id="saveCourse">إضافة الكورس</button></form><p id="courseMessage" class="manage-message" role="status"></p></section>
<section class="manage-panel"><h2>الكورسات والدروس</h2><div id="courseList" class="manage-list"><div class="manage-empty">جاري تحميل الكورسات...</div></div><p id="lessonMessage" class="manage-message" role="status"></p></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/admin-courses.js"></script></body></html>
